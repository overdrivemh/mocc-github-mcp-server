name: MOCC disposable Wiki lint fix

on:
  push:
    branches: ["mocc/wiki-toolset"]
    paths: [".github/workflows/mocc-wiki-lint-fix.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mocc/wiki-toolset
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Apply exact lint-only correction
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pkg/github/wiki.go")
          s = p.read_text()
          old = 'Wiki page %q is not a regular non-symlink file'
          new = 'wiki page %q is not a regular non-symlink file'
          assert s.count(old) == 2, s.count(old)
          p.write_text(s.replace(old, new))
          PY
          go test ./pkg/github -run 'TestWikiPage(IORejectsSymlinksWithoutTouchingTarget|WriteCreatesAndReplacesRegularFile)' -count=1
          git diff --check
      - name: Commit exact correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mocc-wiki-maintainer"
          git config user.email "mocc-wiki-maintainer@users.noreply.github.com"
          git add pkg/github/wiki.go
          git diff --cached --quiet && exit 1
          git commit -m "fix: satisfy Wiki no-follow error style"
          git push origin HEAD:mocc/wiki-toolset
