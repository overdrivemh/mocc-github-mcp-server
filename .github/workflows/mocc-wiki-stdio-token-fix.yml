name: MOCC disposable Wiki stdio principal fix

on:
  push:
    branches: ["mocc/wiki-toolset"]
    paths:
      - ".github/workflows/mocc-wiki-stdio-token-fix.yml"
      - ".github/mocc-wiki-stdio-token-fix.py"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: mocc/wiki-toolset
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: Apply exact stdio principal correction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/mocc-wiki-stdio-token-fix.py
          python3 .github/mocc-wiki-stdio-token-fix.py
          gofmt -w internal/ghmcp/server.go internal/ghmcp/server_test.go
          go test ./internal/ghmcp ./pkg/github -run 'Test(CreateTokenContextMiddleware|Wiki|ValidateWiki|ParseWiki|RequireWiki|SanitizeWiki)' -count=1
          git diff --check
      - name: Commit bounded correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "mocc-wiki-maintainer"
          git config user.email "mocc-wiki-maintainer@users.noreply.github.com"
          git add internal/ghmcp/server.go internal/ghmcp/server_test.go
          git diff --cached --quiet && exit 1
          git commit -m "fix: bind stdio Git transport to request principal"
          git push origin HEAD:mocc/wiki-toolset
