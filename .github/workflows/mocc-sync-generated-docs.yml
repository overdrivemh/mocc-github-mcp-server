name: MOCC disposable generated-doc sync

on:
  push:
    branches:
      - mocc/wiki-toolset

permissions:
  contents: write

jobs:
  sync-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: mocc/wiki-toolset
          fetch-depth: 0

      - name: Build UI
        uses: ./.github/actions/build-ui

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Generate canonical documentation
        run: go run ./cmd/github-mcp-server generate-docs

      - name: Commit README only when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README_ALREADY_CURRENT=true"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync generated Wiki tool documentation"
          git push origin HEAD:mocc/wiki-toolset
